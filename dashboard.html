<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ESP32 Sound Classifier</title>
  <style>
    :root {
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #123b55;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 48px;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgba(7, 72, 126, .18), rgba(2, 54, 84, .34)),
        url("/dashboard-background.png?v=3") center top / cover fixed no-repeat,
        #48b8df;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(21, 121, 190, .04) 0%, rgba(2, 72, 108, .12) 100%);
    }
    main { position: relative; z-index: 1; max-width: 850px; margin: 0 auto; }
    .hero { text-align: center; margin-bottom: 18px; text-shadow: 0 2px 0 rgba(255,255,255,.75); }
    .hero-mark {
      width: 74px; height: 74px; margin: 0 auto 10px;
      display: grid; place-items: center;
      border: 2px solid rgba(255,255,255,.95);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff 0 6%, #bdf5ff 24%, #36b9ed 58%, #176cae 100%);
      box-shadow: 0 8px 18px rgba(21, 94, 145, .28), inset 0 0 12px rgba(255,255,255,.9);
      font-size: 31px;
    }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.8rem); letter-spacing: -.04em; color: #082f48; }
    .subtitle { margin: 6px 0 0; color: #164f69; font-size: 1rem; font-weight: 800; }
    .status-line { color: #164f69 !important; font-size: .98rem !important; }
    .scores-title { color: #082f48; }
    .glass {
      border: 1px solid rgba(255,255,255,.96);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(224,249,255,.88));
      box-shadow: 0 18px 40px rgba(3, 48, 78, .32), inset 0 1px rgba(255,255,255,.98);
      backdrop-filter: blur(14px);
      color: #082f48;
    }
    .hero {
      padding: 8px 14px 12px;
      border-radius: 22px;
      background: rgba(236, 251, 255, .88);
      box-shadow: 0 10px 25px rgba(3, 48, 78, .24);
    }
    .now-playing { position: relative; overflow: hidden; padding: 23px; margin-bottom: 18px; }
    .now-playing::after {
      content: ""; position: absolute; left: 18px; right: 18px; top: 7px; height: 9px;
      border-radius: 50%; background: rgba(255,255,255,.7); filter: blur(2px);
    }
    .status-line { display: flex; align-items: center; gap: 8px; color: #39718b; font-size: .88rem; font-weight: 700; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #54dc72; box-shadow: 0 0 10px #54dc72; }
    .headline { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 16px; }
    .prediction-wrap { min-width: 0; }
    .prediction-label { display: block; color: #5b8294; font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .prediction { display: block; margin-top: 4px; font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 900; line-height: 1; overflow-wrap: anywhere; }
    .confidence-orb {
      flex: 0 0 auto; width: 108px; height: 108px; display: grid; place-items: center;
      border: 3px solid rgba(255,255,255,.9); border-radius: 50%; text-align: center;
      background: radial-gradient(circle at 35% 25%, #fff 0 4%, #bff8db 23%, #3cc69b 60%, #19899a 100%);
      box-shadow: 0 10px 20px rgba(31, 130, 151, .24), inset 0 -9px 18px rgba(15,100,130,.16);
    }
    .confidence { font-size: 1.35rem; font-weight: 900; }
    .confidence-orb small { display: block; margin-top: -5px; color: #307d80; text-transform: uppercase; }
    .scores-panel { padding: 20px; }
    .scores-title { margin: 0 0 12px; font-size: 1rem; letter-spacing: .05em; text-transform: uppercase; }
    .bar-row { display: grid; grid-template-columns: minmax(120px, 185px) 1fr 64px; align-items: center; gap: 12px; padding: 6px 0; }
    .name { font-weight: 800; overflow-wrap: anywhere; }
    .track { height: 16px; overflow: hidden; border: 1px solid rgba(74,142,174,.28); border-radius: 999px; background: rgba(117,183,205,.22); box-shadow: inset 0 2px 4px rgba(40,96,130,.16); }
    .fill { height: 100%; min-width: 0; border-radius: inherit; background: linear-gradient(180deg, #efffff 0 22%, #74d8ff 23%, #24addf 68%, #168ac6 100%); box-shadow: inset 0 0 3px rgba(255,255,255,.85); transition: width 260ms ease; }
    .bar-row.top .fill { background: linear-gradient(180deg, #efffff 0 22%, #bdf884 23%, #63d43e 68%, #28a82d 100%); }
    .percent { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }
    .empty { color: #39718b; padding: 12px 0; text-align: center; }
    @media (max-width: 520px) {
      body { padding: 18px 10px 36px; }
      .hero-mark { width: 62px; height: 62px; }
      .now-playing { padding: 18px; }
      .confidence-orb { width: 92px; height: 92px; }
      .scores-panel { padding: 14px 12px; }
      .bar-row { grid-template-columns: minmax(92px, 1fr) 1fr 52px; gap: 7px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-mark" aria-hidden="true">♫</div>
      <h1>ESP32 Sound Classifier</h1>
      <p class="subtitle">Live UrbanSound8K sound intelligence</p>
    </header>

    <section class="now-playing glass" aria-live="polite">
      <div class="status-line"><span class="status-dot"></span><span id="status">Connecting to prediction server…</span></div>
      <div id="prediction" class="empty">Waiting for the first ESP32 prediction.</div>
    </section>

    <section class="scores-panel glass">
      <h2 class="scores-title">Class confidence</h2>
      <div id="scores"></div>
    </section>
  </main>
  <script>
    const statusElement = document.getElementById("status");
    const predictionElement = document.getElementById("prediction");
    const scoresElement = document.getElementById("scores");

    function displayName(name) {
      return name.replaceAll("_", " ").replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function displayPrediction(data) {
      const entries = Object.entries(data.scores || {})
        .filter(([, score]) => Number.isFinite(Number(score)))
        .map(([name, score]) => [name, Math.max(0, Math.min(1, Number(score)))])
        .sort((a, b) => b[1] - a[1]);

      predictionElement.className = "headline";
      predictionElement.replaceChildren();

      const wrap = document.createElement("div");
      wrap.className = "prediction-wrap";
      const caption = document.createElement("span");
      caption.className = "prediction-label";
      caption.textContent = "Highest confidence";
      const label = document.createElement("span");
      label.className = "prediction";
      label.textContent = displayName(data.label);
      wrap.append(caption, label);

      const orb = document.createElement("div");
      orb.className = "confidence-orb";
      const confidenceText = document.createElement("div");
      const confidence = document.createElement("span");
      confidence.className = "confidence";
      confidence.textContent = `${(Number(data.confidence) * 100).toFixed(1)}%`;
      const confidenceCaption = document.createElement("small");
      confidenceCaption.textContent = "confidence";
      confidenceText.append(confidence, confidenceCaption);
      orb.append(confidenceText);
      predictionElement.append(wrap, orb);

      scoresElement.replaceChildren();
      for (const [index, [name, score]] of entries.entries()) {
        const row = document.createElement("div");
        row.className = `bar-row${index === 0 ? " top" : ""}`;

        const className = document.createElement("span");
        className.className = "name";
        className.textContent = displayName(name);

        const track = document.createElement("div");
        track.className = "track";
        track.setAttribute("role", "meter");
        track.setAttribute("aria-label", `${className.textContent} confidence`);
        track.setAttribute("aria-valuemin", "0");
        track.setAttribute("aria-valuemax", "100");
        track.setAttribute("aria-valuenow", String((score * 100).toFixed(1)));

        const fill = document.createElement("div");
        fill.className = "fill";
        fill.style.width = `${(score * 100).toFixed(1)}%`;
        track.append(fill);

        const percent = document.createElement("span");
        percent.className = "percent";
        percent.textContent = `${(score * 100).toFixed(1)}%`;
        row.append(className, track, percent);
        scoresElement.append(row);
      }
    }

    async function refresh() {
      if (location.protocol === "file:") {
        statusElement.textContent =
          "Open this dashboard through the receiver at http://<computer-ipv4>:8000/; do not open dashboard.html directly.";
        return;
      }

      try {
        const response = await fetch("/api/predictions", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        statusElement.textContent = "Connected · refreshing every second";
        if (!result.prediction) {
          predictionElement.className = "empty";
          predictionElement.textContent = "Waiting for the first ESP32 prediction.";
          scoresElement.replaceChildren();
        } else if (result.prediction.scores) {
          displayPrediction(result.prediction);
        } else {
          statusElement.textContent = "Connected · upload the updated ESP32 sketch to show every class";
        }
      } catch (error) {
        const apiUrl = new URL("/api/predictions", location.href);
        statusElement.textContent =
          `Cannot reach ${apiUrl.href}: ${error.message}. Check that receive_predictions.py is running and use the computer's current IPv4 address.`;
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
